name: Build APK

# Baut automatisch eine installierbare APK (zum Testen) und ein AAB (für Google Play).
# Nutzung: Projekt in ein GitHub-Repository hochladen, dann unter
# "Actions" -> "Build APK" -> "Run workflow" starten. Danach unter
# "Artifacts" die Datei "werkcalc-apk" herunterladen.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Erzeugt android/ (applicationId de.werkcalc.werkcalc), setzt den Namen
      # "WerkCalc" und das App-Icon. Die Kennung nach der Veröffentlichung NIE ändern.
      - name: Android-Projekt einrichten
        run: bash tools/setup_android.sh

      - name: Analyse (Hinweise blockieren den Build nicht)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Tests
        run: |
          set +e
          flutter test --reporter failures-only > test_out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=Testfehler::$(head -c 3500 test_out.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          if [ -f test_report.txt ]; then
            echo "::notice title=Testbericht::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' test_report.txt | head -c 3500)"
          fi
          exit $code

      - name: Katalog-Übersicht (zur Prüfung)
        run: |
          if [ -f katalog_dump.txt ]; then
            split -b 48000 -d katalog_dump.txt kd_
            for f in kd_*; do
              echo "::notice title=Katalog-$f::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' $f)"
            done
          fi

      - name: APK bauen (Test-Installation)
        run: |
          set +e
          flutter build apk --release > build_out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=Buildfehler::$( (grep -n -i -E 'error|wrong|failed|exception|requires|minSdk|cannot|not found' build_out.txt | head -40; echo ----; tail -n 25 build_out.txt) | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $code

      - name: AAB bauen (für Google Play)
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: werkcalc-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: werkcalc-aab
          path: build/app/outputs/bundle/release/app-release.aab
